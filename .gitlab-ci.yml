pages:
  stage: deploy
  image: alpine:3.20
  script:
    - mkdir -p public
    - cp model-routing-dashboard.html public/index.html
    - cp model-routing-by-category.csv public/model-routing-by-category.csv
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
